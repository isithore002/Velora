<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <g filter="url(#glow)">
    <!-- Outer Shield -->
    <path d="M50 15 L85 25 L85 50 C85 70 50 90 50 90 C50 90 15 70 15 50 L15 25 Z" fill="none" stroke="#22c55e" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Inner V and Nodes -->
    <path d="M25 35 L50 75 L75 35" fill="none" stroke="#4ade80" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Central Node -->
    <circle cx="50" cy="50" r="8" fill="none" stroke="#4ade80" stroke-width="3"/>
    <circle cx="50" cy="50" r="3" fill="#4ade80"/>
    
    <!-- Side Nodes -->
    <circle cx="25" cy="35" r="4" fill="#22c55e"/>
    <circle cx="75" cy="35" r="4" fill="#22c55e"/>
    <circle cx="50" cy="75" r="4" fill="#22c55e"/>
  </g>
</svg>
